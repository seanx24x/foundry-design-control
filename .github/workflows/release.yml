name: Publish beta

on:
  workflow_dispatch:
    inputs:
      promote_latest:
        description: Move npm latest to this validated beta
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm test:e2e
      - run: pnpm release:check
      - run: pnpm release:pack
      - run: pnpm release:test-install
      - run: pnpm mcpb:build
      - name: Publish beta packages
        run: pnpm release:publish -- ${{ inputs.promote_latest && '--promote-latest' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
