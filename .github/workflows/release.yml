name: Publish beta

on:
  workflow_dispatch:
    inputs:
      promote_latest:
        description: Move npm latest after publishing (requires NODE_AUTH_TOKEN)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm test:e2e
      - run: pnpm release:check
      - run: pnpm release:pack
      - run: pnpm release:test-install
      - run: pnpm distribution:check
      - run: pnpm mcpb:build
      - name: Publish beta packages
        run: pnpm release:publish -- ${{ inputs.promote_latest && '--promote-latest' || '' }}
