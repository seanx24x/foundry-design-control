name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm test:e2e
      - run: pnpm test:next
      - run: pnpm test:next:apply
      - name: Retain redesigned inspector regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-workspace
          path: |
            artifacts/next-workspace/
            artifacts/next-apply/
          if-no-files-found: ignore
      - run: pnpm test:recording
      - run: pnpm test:showcase
      - name: Retain real showcase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase
          path: artifacts/showcase-*/
          if-no-files-found: ignore
      - name: Retain recording rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-rehearsal
          path: artifacts/recording-rehearsal/
          if-no-files-found: ignore
      - run: pnpm release:check
      - run: pnpm release:pack
      - run: pnpm release:verify-artifacts
      - run: pnpm release:test-install
      - run: pnpm test:golden:packed
      - run: pnpm test:golden:negative
      - run: pnpm test:compatibility:packed
      - name: Retain framework compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-compatibility
          path: artifacts/compatibility/*.json
          if-no-files-found: ignore
      - run: pnpm distribution:check
      - run: pnpm mcpb:build
